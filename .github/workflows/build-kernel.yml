name: build-kernel

# A52xq SukiSU Ultra 内核构建（SUSFS + SELinux 隐藏）
# 入口：仓库里的 _pub/entry.sh —— 以后改构建内容只要改那个小文件即可
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 编译并回传日志
        # gh release create 必须拿到 GH_TOKEN，否则 gh 直接报
        # "To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN environment variable"
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash _pub/entry.sh
